version: '3.8'

services:
  server:
    build: ./server
    container_name: erp_server
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/erp_db
      - SECRET_KEY=ani1820
      - SESSION_SECRET=ani_enterprise_erp_secret_key
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: erp_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

  mongo:
    image: mongo
    container_name: erp_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

